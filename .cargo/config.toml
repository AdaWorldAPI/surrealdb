[build]
rustflags = ["--cfg", "tokio_unstable"]

# Enable AVX-512 baseline on x86_64 Linux (matches ndarray-hpc's
# `.cargo/config.toml` convention) so the vector-hpc SIMD path can use
# AVX-512 native intrinsics via the F64x8 polyfill's LazyLock<Tier>
# cache. The polyfill still degrades gracefully on pre-v4 hardware via
# the AVX2 / scalar tiers; this just lets a v4 build inline the best
# code path. Override locally for older targets via:
#   RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v4"]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-unknown-linux-musl]
rustflags = [
	"-C", "target-feature=+crt-static"
]

[target.x86_64-pc-windows-msvc]
rustflags = [
	"-C", "target-feature=+crt-static",
	"-C", "link-arg=/NODEFAULTLIB:libvcruntimed.lib",
	"-C", "link-arg=/NODEFAULTLIB:vcruntime.lib",
	"-C", "link-arg=/NODEFAULTLIB:vcruntimed.lib",
	"-C", "link-arg=/NODEFAULTLIB:libcmtd.lib",
	"-C", "link-arg=/NODEFAULTLIB:msvcrt.lib",
	"-C", "link-arg=/NODEFAULTLIB:msvcrtd.lib",
	"-C", "link-arg=/NODEFAULTLIB:libucrt.lib",
	"-C", "link-arg=/NODEFAULTLIB:libucrtd.lib",
	"-C", "link-arg=/NODEFAULTLIB:ucrtd.lib",
	"-C", "link-arg=/DEFAULTLIB:libvcruntime.lib",
	"-C", "link-arg=/DEFAULTLIB:libcmt.lib",
	"-C", "link-arg=/DEFAULTLIB:ucrt.lib"
]
